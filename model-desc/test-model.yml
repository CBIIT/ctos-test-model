Handle: test
Nodes:
  case:
    Props:
      - case_id
      - patient_id
    Term:
      - Value: Participant
        Origin: NCIT
        Code: C29867
      - Value: Subject
        Origin: NCIT
        Code: C48910
  sample:
    Props:
      - sample_type
      - amount
  file:
    Props:
      - md5sum
      - file_name
      - file_size
  diagnosis:
    Props:
      - disease
      - date_of_dx
Relationships:
  of_case:
    Props:
      - days_to_sample
    Mul: one_to_one
    Ends:
      - Src: sample
        Dst: case
        Mul: many_to_one
      - Src: diagnosis
        Dst: case
  of_sample:
    Props: ~
    Mul: one_to_one
    Ends:
      - Src: file
        Dst: sample
        Mul: many_to_many
  derived_from:
    Mul: one_to_many
    Props:
      - workflow_id
      - id
    Ends:
      - Src: file
        Dst: file
      - Src: sample
        Dst: sample
